name: Lore image

on:
  pull_request:
    paths:
      - docker/lore/**
      - .github/workflows/lore-image.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  LORE_VERSION: 0.8.5
  LORE_REVISION: 2d86d1dda98bfc1575ac7a20a6ff8c7fbc760383
  LORE_IMAGE_VERSION: 0.8.5-unrealops.1
  LORE_SOURCE: https://github.com/epicgames/lore

jobs:
  verify:
    name: Build and scan (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm64
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.72.0
          cache: false
      - name: Build pinned Lore source
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: docker/lore
          file: docker/lore/Dockerfile
          build-contexts: |
            lore-source=${{ env.LORE_SOURCE }}.git#${{ env.LORE_REVISION }}
          build-args: |
            LORE_VERSION=${{ env.LORE_VERSION }}
            LORE_REVISION=${{ env.LORE_REVISION }}
            LORE_SOURCE=${{ env.LORE_SOURCE }}
          platforms: ${{ matrix.platform }}
          load: true
          tags: lore:verify-${{ matrix.arch }}
          cache-from: type=gha,scope=lore-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=lore-${{ matrix.arch }}
      - name: Verify runtime metadata
        run: |
          set -euo pipefail
          test "$(docker image inspect lore:verify-${{ matrix.arch }} --format '{{.Config.User}}')" = "65532:65532"
          test "$(docker image inspect lore:verify-${{ matrix.arch }} --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$LORE_REVISION"
      - name: Smoke test health endpoint
        if: matrix.arch == 'amd64'
        run: |
          set -euo pipefail
          container_id="$(
            docker run --detach --read-only \
              --tmpfs /tmp:uid=65532,gid=65532 \
              --tmpfs /var/lib/lore:uid=65532,gid=65532 \
              --publish 41339:41339 \
              lore:verify-amd64
          )"
          trap 'docker logs "$container_id"; docker rm --force "$container_id"' EXIT
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:41339/health_check; then
              docker logs "$container_id" 2>&1 | grep -E 'immutable stores:.*aws'
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Scan image
        run: |
          trivy image \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            lore:verify-${{ matrix.arch }}

  publish:
    name: Publish signed multi-architecture image
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    environment: lore-image
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_LORE_IMAGE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - name: Resolve foundation repository
        id: repository
        env:
          REPOSITORY_NAME: ${{ vars.AWS_LORE_ECR_REPOSITORY }}
        run: |
          set -euo pipefail
          repository_uri="$(
            aws ecr describe-repositories \
              --repository-names "$REPOSITORY_NAME" \
              --query 'repositories[0].repositoryUri' \
              --output text
          )"
          echo "uri=$repository_uri" >>"$GITHUB_OUTPUT"
          registry="${repository_uri%%/*}"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
      - name: Build and publish
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: docker/lore
          file: docker/lore/Dockerfile
          build-contexts: |
            lore-source=${{ env.LORE_SOURCE }}.git#${{ env.LORE_REVISION }}
          build-args: |
            LORE_VERSION=${{ env.LORE_VERSION }}
            LORE_REVISION=${{ env.LORE_REVISION }}
            LORE_SOURCE=${{ env.LORE_SOURCE }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.repository.outputs.uri }}:${{ env.LORE_IMAGE_VERSION }}
            ${{ steps.repository.outputs.uri }}:${{ env.LORE_REVISION }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=lore-publish
          cache-to: type=gha,mode=max,scope=lore-publish
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign and print deployable digest
        env:
          IMAGE_URI: ${{ steps.repository.outputs.uri }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE_URI}@${IMAGE_DIGEST}"
          printf 'Deploy with: %s@%s\n' "$IMAGE_URI" "$IMAGE_DIGEST"
