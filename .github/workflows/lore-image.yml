name: Lore image

on:
  pull_request:
    paths:
      - docker/lore/**
      - .github/workflows/lore-image.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  LORE_VERSION: 0.8.5
  LORE_REVISION: 2d86d1dda98bfc1575ac7a20a6ff8c7fbc760383
  LORE_IMAGE_VERSION: 0.8.5-unrealops.1
  LORE_SOURCE: https://github.com/epicgames/lore

jobs:
  verify:
    name: Build and scan (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Provision fat-LTO linker swap
        env:
          SWAP_FILE: ${{ runner.temp }}/lore-linker.swap
        run: |
          set -euo pipefail
          sudo fallocate --length 16G "$SWAP_FILE"
          sudo chmod 600 "$SWAP_FILE"
          sudo mkswap "$SWAP_FILE"
          sudo swapon "$SWAP_FILE"
          free --human
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.72.0
          cache: false
      - name: Build pinned Lore source
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: docker/lore
          file: docker/lore/Dockerfile
          build-contexts: |
            lore-source=${{ env.LORE_SOURCE }}.git#${{ env.LORE_REVISION }}
          build-args: |
            LORE_VERSION=${{ env.LORE_VERSION }}
            LORE_REVISION=${{ env.LORE_REVISION }}
            LORE_SOURCE=${{ env.LORE_SOURCE }}
          platforms: ${{ matrix.platform }}
          load: true
          tags: lore:verify-${{ matrix.arch }}
          cache-from: type=gha,scope=lore-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=lore-${{ matrix.arch }}
      - name: Verify runtime metadata
        run: |
          set -euo pipefail
          test "$(docker image inspect lore:verify-${{ matrix.arch }} --format '{{.Config.User}}')" = "65532:65532"
          test "$(docker image inspect lore:verify-${{ matrix.arch }} --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$LORE_REVISION"
      - name: Smoke test health endpoint
        if: matrix.arch == 'amd64'
        run: |
          set -euo pipefail
          container_id="$(
            docker run --detach --read-only \
              --tmpfs /tmp:uid=65532,gid=65532 \
              --tmpfs /var/lib/lore:uid=65532,gid=65532 \
              --publish 41339:41339 \
              lore:verify-amd64
          )"
          trap 'docker logs "$container_id"; docker rm --force "$container_id"' EXIT
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:41339/health_check; then
              docker logs "$container_id" 2>&1 | grep -E 'immutable stores:.*aws'
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Scan image
        run: |
          trivy image \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            lore:verify-${{ matrix.arch }}

  publish-platform:
    name: Publish platform digest (${{ matrix.platform }})
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ${{ matrix.runner }}
    environment: lore-image
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Provision fat-LTO linker swap
        env:
          SWAP_FILE: ${{ runner.temp }}/lore-linker.swap
        run: |
          set -euo pipefail
          sudo fallocate --length 16G "$SWAP_FILE"
          sudo chmod 600 "$SWAP_FILE"
          sudo mkswap "$SWAP_FILE"
          sudo swapon "$SWAP_FILE"
          free --human
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_LORE_IMAGE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - name: Resolve foundation repository
        id: repository
        env:
          REPOSITORY_NAME: ${{ vars.AWS_LORE_ECR_REPOSITORY }}
        run: |
          set -euo pipefail
          repository_uri="$(
            aws ecr describe-repositories \
              --repository-names "$REPOSITORY_NAME" \
              --query 'repositories[0].repositoryUri' \
              --output text
          )"
          echo "uri=$repository_uri" >>"$GITHUB_OUTPUT"
          registry="${repository_uri%%/*}"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
      - name: Build and publish platform digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: docker/lore
          file: docker/lore/Dockerfile
          build-contexts: |
            lore-source=${{ env.LORE_SOURCE }}.git#${{ env.LORE_REVISION }}
          build-args: |
            LORE_VERSION=${{ env.LORE_VERSION }}
            LORE_REVISION=${{ env.LORE_REVISION }}
            LORE_SOURCE=${{ env.LORE_SOURCE }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ steps.repository.outputs.uri }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=lore-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=lore-${{ matrix.arch }}
      - name: Export platform digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          DIGEST_DIR: ${{ runner.temp }}/lore-digests
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p "$DIGEST_DIR"
          touch "$DIGEST_DIR/${IMAGE_DIGEST#sha256:}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lore-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/lore-digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish signed multi-architecture image
    if: github.event_name == 'workflow_dispatch'
    needs: publish-platform
    runs-on: ubuntu-24.04
    environment: lore-image
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: lore-digest-*
          path: ${{ runner.temp }}/lore-digests
          merge-multiple: true
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_LORE_IMAGE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - name: Resolve foundation repository
        id: repository
        env:
          REPOSITORY_NAME: ${{ vars.AWS_LORE_ECR_REPOSITORY }}
        run: |
          set -euo pipefail
          repository_uri="$(
            aws ecr describe-repositories \
              --repository-names "$REPOSITORY_NAME" \
              --query 'repositories[0].repositoryUri' \
              --output text
          )"
          echo "uri=$repository_uri" >>"$GITHUB_OUTPUT"
          registry="${repository_uri%%/*}"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
      - name: Assemble multi-architecture manifest
        id: manifest
        env:
          DIGEST_DIR: ${{ runner.temp }}/lore-digests
          IMAGE_URI: ${{ steps.repository.outputs.uri }}
        run: |
          set -euo pipefail
          mapfile -t digest_files < <(find "$DIGEST_DIR" -maxdepth 1 -type f -print | sort)
          test "${#digest_files[@]}" -eq 2
          sources=()
          for digest_file in "${digest_files[@]}"; do
            digest="$(basename "$digest_file")"
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
            sources+=("${IMAGE_URI}@sha256:${digest}")
          done
          docker buildx imagetools create \
            --tag "${IMAGE_URI}:${LORE_IMAGE_VERSION}" \
            --tag "${IMAGE_URI}:${LORE_REVISION}" \
            "${sources[@]}"
          image_digest="$(
            docker buildx imagetools inspect \
              "${IMAGE_URI}:${LORE_IMAGE_VERSION}" \
              --format '{{json .Manifest}}' | jq -er '.digest'
          )"
          [[ "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$image_digest" >>"$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign and print deployable digest
        env:
          IMAGE_URI: ${{ steps.repository.outputs.uri }}
          IMAGE_DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE_URI}@${IMAGE_DIGEST}"
          printf 'Deploy with: %s@%s\n' "$IMAGE_URI" "$IMAGE_DIGEST"
