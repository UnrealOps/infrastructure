apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: lore-edge
  labels:
    {{- include "lore.labels" . | nindent 4 }}
spec:
  role: {{ .Values.edge.nodeRole | quote }}
  amiSelectorTerms:
    - alias: {{ .Values.edge.amiAlias | quote }}
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ .Values.clusterName | quote }}
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ .Values.clusterName | quote }}
  instanceStorePolicy: RAID0
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 1
    httpTokens: required
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        deleteOnTermination: true
        encrypted: true
        volumeSize: 100Gi
        volumeType: gp3
  tags:
    Name: {{ printf "%s-lore-edge" .Values.clusterName | quote }}
    Environment: {{ .Values.clusterName | quote }}
    karpenter.sh/discovery: {{ .Values.clusterName | quote }}
    unrealops.io/lore-tier: edge
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: lore-edge
  labels:
    {{- include "lore.labels" . | nindent 4 }}
spec:
  template:
    metadata:
      labels:
        unrealops.io/capacity-provider: karpenter
        unrealops.io/lore-tier: edge
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: lore-edge
      taints:
        - key: unrealops.io/lore-edge
          value: "true"
          effect: NoSchedule
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values:
            - arm64
        - key: kubernetes.io/os
          operator: In
          values:
            - linux
        - key: karpenter.sh/capacity-type
          operator: In
          values:
            - on-demand
        - key: node.kubernetes.io/instance-type
          operator: In
          values:
            {{- toYaml .Values.edge.instanceTypes | nindent 12 }}
      expireAfter: 720h
      terminationGracePeriod: 1h
  limits:
    cpu: {{ mul (add (.Values.edge.replicas | int) 1) 16 | quote }}
    memory: {{ printf "%dGi" (mul (add (.Values.edge.replicas | int) 1) 32) | quote }}
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 30m
    budgets:
      - nodes: "1"
  weight: 100
