apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: lore-edge-runtime
  namespace: lore
  labels:
    {{- include "lore.labels" . | nindent 4 }}
spec:
  provider: aws
  parameters:
    usePodIdentity: "true"
    region: {{ .Values.aws.region | quote }}
    objects: |
      - objectName: {{ .Values.runtimeSecretName | quote }}
        objectType: secretsmanager
        jmesPath:
          - path: ca_cert
            objectAlias: ca.crt
          - path: edge_cert
            objectAlias: edge.crt
          - path: edge_key
            objectAlias: edge.key
          - path: edge_client_cert
            objectAlias: edge-client.crt
          - path: edge_client_key
            objectAlias: edge-client.key
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: lore-write-runtime
  namespace: lore
  labels:
    {{- include "lore.labels" . | nindent 4 }}
spec:
  provider: aws
  parameters:
    usePodIdentity: "true"
    region: {{ .Values.aws.region | quote }}
    objects: |
      - objectName: {{ .Values.runtimeSecretName | quote }}
        objectType: secretsmanager
        jmesPath:
          - path: ca_cert
            objectAlias: ca.crt
          - path: write_cert
            objectAlias: write.crt
          - path: write_key
            objectAlias: write.key
